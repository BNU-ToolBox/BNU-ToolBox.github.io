name: Refresh Latest Release

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-latest-release
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Refresh release manifest
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/update_release.py

      - name: Commit changed manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases.json
          if git diff --cached --quiet; then
            echo "No release change"
            exit 0
          fi
          git commit -m "chore: refresh latest release"
          git push
